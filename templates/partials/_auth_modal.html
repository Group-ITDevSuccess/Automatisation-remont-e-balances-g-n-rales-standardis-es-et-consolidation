<div class="modal fade" id="authModal" tabindex="-1" role="dialog" aria-labelledby="authModalLabel"
     aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="col-lg-8 col-md-12">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="authModalLabel">Débuter Inventaire</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="d-flex text-center  align-items-center justify-content-center  mb-4 ">
                            <span class="d-flex align-items-center justify-content-center"
                                  style="border: 2px solid #0c0c0c; border-radius: 50%; width: 70px; height: 70px;">
                                <i class="fas fa-lock fa-2x"></i>
                            </span>
                    </div>

                    <form id="authForm">
                        <div class="form-group">
                            <label for="id_username">Session Utilisateur</label>
                            {{ auth_form.username }}
                        </div>
                        <div class="form-group">
                            <label for="id_password">Mot de passe</label>
                            <div class="input-group">
                                {{ auth_form.password }}
                                <div class="input-group-append">
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success btn-block">Authoriser</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>
